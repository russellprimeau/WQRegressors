# XGBoost Regressor Model Configuration
# Example configuration for training an XGBoost Regressor for regression tasks

model_type: xgb_regressor
model_name: xgbregressor

# Data configuration
data:
  data_dir: "../data/output/regression/Farge"
  forecast_name: "nowcast"
  input_columns:
    - 'Pfl - Water temperature (°C)'
    - 'Pfl - Sp Cond (microS_cm)'
    - 'Pfl - pH'
    - 'Pfl - DO (% Sat)'
    - 'Pfl - Turbidity (FNU)'
    - 'Pfl - fDOM (RFU)'
    - 'Pfl - fDOM (QSU)'
    - 'Wind speed, x (m/s)'
    - 'Wind speed, y (m/s)'
    - 'Maximum 3s wind gust (m/s)'
    - 'Atmospheric pressure (mBar)'
    - 'Longwave (IR) radiation (W/m2)'
    - 'Shortwave (solar) radiation (W/m2)'
    - '24hr precipitation total (mm)'
    - 'Air temperature (°C)'
    - 'Humidity (%)'
    - 'SCADA - Temperature (°C)'
    - '01-Farge_state'
  output_columns:
    - '01-Farge_res'
  input_row_1: 0
  input_row_2: 166
  output_rows: -1

# Data split configuration
data_split:
  random_state: 3
  test_size: 0.2
  reuse_split: false
  split_source: null
  split_type: random

# Device configuration
device: cuda  # or 'cpu'

# Model hyperparameters (leave blank to use defaults)
hyperparameters:
  metric: rmse
  tree_method: hist
  objective: reg:squarederror
  n_estimators: 1100
  max_depth: 10
  subsample: 0.2
  colsample_bytree: 0.8
  learning_rate: 0.01
  n_jobs: -1
  early_stopping_rounds: 200
