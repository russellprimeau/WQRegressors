# Experiment Configuration
# All inputs, sweep parameters, and outputs defined in one place.

experiment:
  name: "depth_sweep_farge"
  description: "Sweep over max_depth and learning_rate for Farge regression"

data:
  consolidated_path: "data/output/regression/Consolidated_sparse.csv"
  target_columns: ["01-Farge_res"]
  predictor_cols:
    - "Pfl - Water temperature (°C)"
    - "Pfl - Sp Cond (microS_cm)"
    - "Pfl - pH"
    - "Pfl - DO (% Sat)"
    - "Pfl - Turbidity (FNU)"
    - "Pfl - fDOM (RFU)"
    - "Pfl - fDOM (QSU)"
    - "Wind speed x (m/s)"
    - "Wind speed y (m/s)"
    - "Maximum 3s wind gust (m/s)"
    - "Atmospheric pressure (mBar)"
    - "Longwave (IR) radiation (W/m2)"
    - "Shortwave (solar) radiation (W/m2)"
    - "24hr precipitation total (mm)"
    - "Air temperature (°C)"
    - "Humidity (%)"
    - "SCADA - Temperature (°C)"
    - "01-Farge_state"

sampling:
  # How to break up the consolidated dataset into samples
  sample_length: 168  # Hours of contiguous data per sample
  nan_tol: 0.0  # Max fraction of NaN allowed (when fault_tolerant=true)
  fault_tolerant: true
  to_normalize: []  # Leave empty if normalization already applied upstream

train_test_split:
  # How to split samples into train/test
  type: "random"  # or "temporal"
  test_size: 0.2
  random_state: 3

model_config:
  # How to extract input and output from each sample
  input_row_1: 0
  input_row_2: 166
  output_rows: -1  # Last row only
  
  # Model and forecast naming
  forecast_name: "nowcast"
  model_name: "xgbregressor"

model_hyperparameters:
  # Base hyperparameters (same across all runs)
  objective: "reg:squarederror"
  tree_method: "hist"
  n_jobs: -1
  early_stopping_rounds: 200
  
  # Parameter sweep: each dict creates one run
  # Must include unique 'run_label' and values for parameters to override base settings
  sweep:
    - run_label: "depth8_lr005"
      max_depth: 8
      learning_rate: 0.05
      n_estimators: 600
      subsample: 0.2
      colsample_bytree: 0.8
    
    - run_label: "depth10_lr010"
      max_depth: 10
      learning_rate: 0.10
      n_estimators: 800
      subsample: 0.2
      colsample_bytree: 0.8
    
    - run_label: "depth12_lr003"
      max_depth: 12
      learning_rate: 0.03
      n_estimators: 1200
      subsample: 0.2
      colsample_bytree: 0.8

output:
  # Which metrics and parameters to plot
  plot_metrics: ["rmse", "r2", "mae"]
  plot_params: ["max_depth", "learning_rate"]
  # Plots will be auto-generated and saved to <run_dir>/plots/
